<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phòng thí nghiệm ảo - Vật lý đại cương</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background:#0b1b2e; color:#fff; margin:0; padding:24px; }
    h1 { text-align:center; margin-bottom:4px; }
    .sub { text-align:center; color:#9db8d3; margin-bottom:20px; }
    .search { display:block; margin:0 auto 10px; width:100%; max-width:420px; padding:10px 14px;
              border-radius:10px; border:1px solid #1f5a8f; background:#12304f; color:#fff; font-size:15px; }
    h2 { max-width:1100px; margin:28px auto 8px; font-size:18px; color:#5cc8ff; border-bottom:1px solid #1f5a8f; padding-bottom:6px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; max-width:1100px; margin:0 auto; }
    a.card { background:#12304f; border:1px solid #1f5a8f; border-radius:12px; padding:16px 18px;
             color:#fff; text-decoration:none; display:block; }
    a.card:hover { background:#1a4570; }
    a.card b { color:#5cc8ff; display:block; margin-bottom:4px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <h1>Phòng thí nghiệm ảo - Vật lý đại cương</h1>
  <div class="sub">Bộ môn Vật lý Công nghệ - Trường Đại học Công nghệ GTVT</div>
  <input class="search" id="q" placeholder="Tìm bài thí nghiệm...">
  <div id="app"></div>

  <script>
    const BASE = "https://vinhlypcb-lgtm.github.io/";

    // Mỗi dòng: [tên repo trên GitHub, số bài, tên hiển thị]
    const groups = [
      { name: "Nhóm 2 - Dụng cụ đo", items: [
        ["Bai-2.1_Su_dung_thuoc_kep", "2.1", "Sử dụng thước kẹp"],
        ["Bai-2.2_Su_dung_Panme", "2.2", "Sử dụng Panme"],
        ["Bai-2.3_Su_dung_can_khoi_luong", "2.3", "Sử dụng cân khối lượng"]
      ]},
      { name: "Nhóm 3", items: [
        ["Bai_3.1_Su_dung_Cau_ke", "3.1", "Sử dụng cầu kế"],
        ["Bai_3.2-Xac-dinh-gia-toc-trong-truong", "3.2", "Xác định gia tốc trọng trường"]
      ]},
      { name: "Nhóm 4 - Chuyển động và va chạm", items: [
        ["Bai_4.1_Chuyen_dong_thang_deu", "4.1", "Chuyển động thẳng đều"],
        ["Bai_4.2_Chuyen_dong_nhanh_dan_deu", "4.2", "Chuyển động nhanh dần đều"],
        ["Bai_4.3_Gia_toc_phu_thuoc_luc", "4.3", "Gia tốc phụ thuộc lực"],
        ["Bai_4.4_Gia_toc_phu_thuoc_khoi_luong", "4.4", "Gia tốc phụ thuộc khối lượng"],
        ["Bai_4.5_He_so_ma_sat", "4.5", "Hệ số ma sát"],
        ["Bai_4.6_Va_cham_mem", "4.6", "Va chạm mềm"],
        ["Bai_4.7_Va_cham_dan_hoi", "4.7", "Va chạm đàn hồi"]
      ]},
      { name: "Nhóm 5 - Chuyển động quay", items: [
        ["Bai_5.2_Do_moment_xoan_D", "5.2", "Đo moment xoắn D"],
        ["Bai_5.3.1_Thanh_dai_dong_chat", "5.3.1", "Thanh dài đồng chất"],
        ["Bai_5.3.2_Cau_dac_dong_chat", "5.3.2", "Cầu đặc đồng chất"],
        ["Bai_5.3.3_Dia_dac_dong_chat", "5.3.3", "Đĩa đặc đồng chất"],
        ["Bai_5.3.4_Tru_dac_va_tru_rong", "5.3.4", "Trụ đặc và trụ rỗng"]
      ]},
      { name: "Nhóm 6 - Từ trường", items: [
        ["Bai_6.1_Tu_truong_cuon_day", "6.1", "Từ trường cuộn dây"],
        ["Bai_6.2_Tu_truong_hai_cuon_day", "6.2", "Từ trường hai cuộn dây"],
        ["Bai_6.3_Tu_truong_Solenoid", "6.3", "Từ trường Solenoid"]
      ]}
    ];

    const app = document.getElementById("app");
    groups.forEach(g => {
      const section = document.createElement("section");
      section.innerHTML = "<h2>" + g.name + "</h2><div class='grid'></div>";
      const grid = section.querySelector(".grid");
      g.items.forEach(([repo, num, title]) => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = BASE + repo + "/";
        a.target = "_blank";
        a.innerHTML = "<b>Bài " + num + "</b>" + title;
        grid.appendChild(a);
      });
      app.appendChild(section);
    });

    document.getElementById("q").addEventListener("input", e => {
      const k = e.target.value.toLowerCase().trim();
      document.querySelectorAll("section").forEach(sec => {
        let any = false;
        sec.querySelectorAll("a.card").forEach(c => {
          const ok = c.textContent.toLowerCase().includes(k);
          c.classList.toggle("hidden", !ok);
          if (ok) any = true;
        });
        sec.classList.toggle("hidden", !any);
      });
    });
  </script>
</body>
</html>
